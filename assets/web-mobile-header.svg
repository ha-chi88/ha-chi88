<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript, from UI to cloud.</title>
  <desc id="desc">Web, mobile, and cloud development, in a playful pastel editor layout.</desc>
  <rect width="1200" height="300" rx="22" fill="#fff5df"/>
  <g font-family="'Trebuchet MS', Arial, sans-serif" fill="#40364d">
    <text x="44" y="45" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2.5">BUILD / TEST / SHIP</text>
    <text x="41" y="130" font-size="72" font-weight="700" letter-spacing="-2">TypeScript,</text>
    <rect x="44" y="144" width="365" height="10" rx="5" fill="#eea9bd"/>
    <text x="42" y="211" font-size="55" font-weight="700" letter-spacing="-1.5">from UI to cloud.</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="600">
      <rect x="44" y="244" width="89" height="32" rx="16" fill="#d9f0ed"/>
      <text x="88.5" y="266" text-anchor="middle">WEB</text>
      <rect x="145" y="244" width="113" height="32" rx="16" fill="#e8e0f7"/>
      <text x="201.5" y="266" text-anchor="middle">MOBILE</text>
      <rect x="270" y="244" width="105" height="32" rx="16" fill="#f9dfeb"/>
      <text x="322.5" y="266" text-anchor="middle">CLOUD</text>
    </g>
    <text x="637" y="77" font-size="35" fill="#ad8fc7">✦</text>
    <text x="645" y="250" font-family="ui-monospace, monospace" font-size="33" fill="#bb7a91">{ }</text>
  </g>
  <rect x="751" y="40" width="408" height="232" rx="20" fill="#d8c9e9"/>
  <rect x="745" y="34" width="408" height="232" rx="20" fill="#fffdfa" stroke="#b7a5b8" stroke-width="2"/>
  <path d="M746 73H1152" stroke="#e6dce1"/>
  <circle cx="768" cy="54" r="5" fill="#e9a0b2"/><circle cx="786" cy="54" r="5" fill="#eec789"/><circle cx="804" cy="54" r="5" fill="#9ccdbb"/>
  <text x="1128" y="59" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#78687d">stack.ts</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#53465f">
    <text x="768" y="104"><tspan fill="#9364ae">const</tspan> stack = {</text>
    <text x="789" y="132">web: <tspan fill="#427d6a">'React'</tspan>,</text>
    <text x="789" y="160">mobile: <tspan fill="#427d6a">'React Native + Expo'</tspan>,</text>
    <text x="789" y="188">server: <tspan fill="#427d6a">'Node.js'</tspan>,</text>
    <text x="789" y="216">cloud: <tspan fill="#427d6a">'Cloudflare'</tspan>,</text>
    <text x="768" y="244">};</text>
  </g>
</svg>
